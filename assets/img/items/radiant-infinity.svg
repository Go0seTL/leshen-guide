<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="光明无尽之刃 装备示例图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d2e"/>
      <stop offset=".62" stop-color="#0b111c"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".58">
      <stop offset="0" stop-color="#ffe08a" stop-opacity=".30"/>
      <stop offset=".65" stop-color="#ffe08a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e2a72f"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="63" fill="none" stroke="url(#accent)" stroke-opacity=".42" stroke-width="2"/>
  <rect x="18" y="18" width="476" height="476" rx="50" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
  <circle cx="256" cy="250" r="200" fill="url(#glow)"/>
  
  <g stroke="#ffe08a" stroke-opacity=".28" stroke-width="2">
    <path d="M256 74v38"/><path d="M256 386v38"/><path d="M90 248h38"/><path d="M384 248h38"/>
    <path d="M139 131l27 27"/><path d="M346 338l27 27"/><path d="M373 131l-27 27"/><path d="M166 338l-27 27"/>
  </g>

  <circle cx="256" cy="256" r="146" fill="url(#disc)" stroke="url(#accent)" stroke-opacity=".38" stroke-width="3"/>
  <circle cx="256" cy="256" r="123" fill="none" stroke="#ffe08a" stroke-opacity=".12" stroke-width="1"/>

  <text x="256" y="306" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="138" font-weight="900" fill="url(#accent)">刃</text>

  <g transform="translate(34, 32)">
    <rect width="130" height="32" rx="16" fill="#080d16" fill-opacity=".8" stroke="#ffe08a" stroke-opacity=".35"/>
    <circle cx="18" cy="16" r="4" fill="#ffe08a"/>
    <text x="31" y="21" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="1.2" fill="#dbe5f3">光明装</text>
  </g>
  <text x="478" y="53" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="1.4" fill="#ffe08a" fill-opacity=".75">RADIANT</text>

  <text x="256" y="450" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="26" font-weight="700" fill="#e9eff9">光明无尽之刃</text>
  <text x="34" y="486" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="11" letter-spacing="1.4" fill="#657188">DEMO · 512 × 512</text>
  <text x="478" y="486" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="11" letter-spacing="1.4" fill="#657188">radiant-infinity</text>
</svg>
